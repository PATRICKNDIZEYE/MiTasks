<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" /><title>icon</title>
<style>html, body { margin: 0; background: transparent; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c" width="1024" height="1024"></canvas>
<script>
  // miTasks' icon, drawn as Crew's sibling: the same graphite squircle, with a
  // heavy ivory check whose stroke ends in Crew's amber dot.
  //   icon.html          — macOS: squircle on the icon grid, with its shadow
  //   icon.html?bleed=1  — iOS / PWA: full-bleed square; the OS masks the corners
  const bleed = new URLSearchParams(location.search).has('bleed');
  const c = document.getElementById('c');
  const ctx = c.getContext('2d');

  // Crew's squircle: a superellipse (n = 5) on the 824px macOS grid.
  function squircle(cx, cy, r, n = 5) {
    ctx.beginPath();
    for (let i = 0; i <= 360; i++) {
      const t = (i / 360) * Math.PI * 2;
      const cos = Math.cos(t);
      const sin = Math.sin(t);
      const x = cx + r * Math.sign(cos) * Math.abs(cos) ** (2 / n);
      const y = cy + r * Math.sign(sin) * Math.abs(sin) ** (2 / n);
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.closePath();
  }

  const face = ctx.createLinearGradient(0, bleed ? 0 : 100, 0, bleed ? 1024 : 924);
  face.addColorStop(0, '#2B2A27');
  face.addColorStop(1, '#141412');

  if (bleed) {
    ctx.fillStyle = face;
    ctx.fillRect(0, 0, 1024, 1024);
  } else {
    // Soft drop shadow, then the face, then Crew's top-lit edge.
    ctx.save();
    ctx.filter = 'blur(18px)';
    ctx.globalAlpha = 0.18;
    squircle(512, 526, 412);
    ctx.fillStyle = '#000';
    ctx.fill();
    ctx.restore();

    squircle(512, 512, 412);
    ctx.fillStyle = face;
    ctx.fill();

    const edge = ctx.createLinearGradient(0, 100, 0, 924);
    edge.addColorStop(0, 'rgba(255,255,255,0.18)');
    edge.addColorStop(0.5, 'rgba(255,255,255,0)');
    ctx.strokeStyle = edge;
    ctx.lineWidth = 4;
    ctx.stroke();
  }

  // The glyph: Crew's stroke weight (100 on a 500px mark, scaled 0.9), round caps.
  ctx.save();
  ctx.translate(512, 512);
  ctx.scale(bleed ? 0.82 : 0.9, bleed ? 0.82 : 0.9);
  ctx.translate(-512, -512);

  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.lineWidth = 100;
  ctx.strokeStyle = '#F3F1EA';
  ctx.beginPath();
  ctx.moveTo(300, 540);
  ctx.lineTo(438, 678);
  ctx.lineTo(628, 452);
  ctx.stroke();

  // The dot that finishes the stroke — "you", as in Crew's mark.
  ctx.beginPath();
  ctx.arc(734, 326, 62, 0, Math.PI * 2);
  ctx.fillStyle = '#F2A93B';
  ctx.fill();
  ctx.restore();

  console.log(c.toDataURL('image/png'));
</script>
</body>
</html>
