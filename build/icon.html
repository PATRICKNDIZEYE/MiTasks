<!DOCTYPE html>
<html>
<head><meta charset="UTF-8" /><title>icon</title></head>
<body>
<canvas id="c" width="1024" height="1024"></canvas>
<script>
  const c = document.getElementById('c');
  const ctx = c.getContext('2d');

  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // Warm charcoal squircle on transparent margin (macOS icon grid).
  const g = ctx.createRadialGradient(380, 300, 80, 512, 560, 720);
  g.addColorStop(0, '#26211a');
  g.addColorStop(1, '#121110');
  rr(100, 100, 824, 824, 186);
  ctx.fillStyle = g;
  ctx.fill();

  rr(107, 107, 810, 810, 180);
  ctx.strokeStyle = 'rgba(240,234,221,0.13)';
  ctx.lineWidth = 6;
  ctx.stroke();

  // Progress ring: ivory track, amber arc.
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(512, 512, 262, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(240,234,221,0.15)';
  ctx.lineWidth = 30;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(512, 512, 262, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * 0.72);
  ctx.strokeStyle = '#d9a441';
  ctx.lineWidth = 30;
  ctx.stroke();

  // Ivory check.
  ctx.beginPath();
  ctx.moveTo(394, 524);
  ctx.lineTo(480, 610);
  ctx.lineTo(644, 432);
  ctx.strokeStyle = '#f0eadd';
  ctx.lineWidth = 58;
  ctx.lineJoin = 'round';
  ctx.stroke();

  console.log(c.toDataURL('image/png'));
</script>
</body>
</html>
